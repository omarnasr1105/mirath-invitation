<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIRATH — Powered by El Shazly</title>
<style>
  :root{
    --wax: #7a4a26;
    --wax-light: #a3703f;
    --glow: #f2c879;
    --backdrop-a: #241609;
    --backdrop-b: #140b04;
    --ink: #3a2b1c;
  }
  :root[data-theme="dark"]{
    --backdrop-a: #241609;
    --backdrop-b: #140b04;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 30%, var(--backdrop-a), var(--backdrop-b));
    overflow:hidden;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  @font-face{
    font-family:'Cormorant Garamond';
    src: local('Cormorant Garamond');
  }
  .stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective: 2400px;
    -webkit-perspective: 2400px;
  }
  /* .frame holds both "pages" stacked exactly on top of one another */
  .frame{
    position:relative;
    width:min(100vw, calc(100vh * 941 / 1672));
    aspect-ratio: 941 / 1672;
    max-height:100vh;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.4);
    border-radius: 2px;
  }
  .card{
    position:absolute; inset:0;
    width:100%; height:100%;
    overflow:visible;
  }
  .card img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  /* ---------- Cover (envelope), split into flap + body ---------- */
  #coverCard{
    z-index:3;
    transform-style: preserve-3d;
    overflow:visible;
  }

  .flap{
    z-index:3;
    /* pentagon: flat top edge, two creases converging on the wax seal */
    clip-path: polygon(0% 0%, 100% 0%, 100% 37.5%, 49.9% 51.6%, 0% 37.5%);
    transform-origin: 50% 0%;
    transform-style: preserve-3d;
    will-change: transform, opacity;
  }
  .flap.opening{
    animation: flapOpen 720ms cubic-bezier(.55,0,.35,1) forwards;
  }
  @keyframes flapOpen{
    0%   { transform: rotateX(0deg); }
    100% { transform: rotateX(-172deg); opacity:0; }
  }
  .body{
    z-index:2;
    /* the lower piece the flap tucks into */
    clip-path: polygon(0% 37.5%, 49.9% 51.6%, 100% 37.5%, 100% 100%, 0% 100%);
    will-change: transform, opacity;
  }
  .body.dropping{
    animation: bodyDrop 760ms cubic-bezier(.55,0,.85,.35) forwards;
  }
  @keyframes bodyDrop{
    0%   { transform: translateY(0); opacity:1; }
    75%  { transform: translateY(70%); opacity:1; }
    100% { transform: translateY(150%); opacity:0; }
  }
  #coverCard.hidden .flap,
  #coverCard.hidden .body{ visibility:hidden; }

  .seal-btn{
    position:absolute;
    left:49.9%; top:51.6%;
    width:23%; aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:transparent;
    border:none;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    z-index:4;
  }
  .seal-btn:focus-visible{
    outline:3px solid var(--glow);
    outline-offset:6px;
  }
  .seal-ring{
    position:absolute; inset:-18%;
    border-radius:50%;
    box-shadow: 0 0 0 0 rgba(242,200,121,.55);
    animation: pulseRing 2.6s ease-out infinite;
    pointer-events:none;
  }
  @keyframes pulseRing{
    0%   { box-shadow: 0 0 0 0 rgba(242,200,121,.45); }
    70%  { box-shadow: 0 0 0 22px rgba(242,200,121,0); }
    100% { box-shadow: 0 0 0 0 rgba(242,200,121,0); }
  }
  .seal-btn:active .seal-ring{ animation-play-state: paused; }

  .glow-burst{
    position:absolute;
    left:49.9%; top:51.6%;
    width:10px; height:10px;
    transform:translate(-50%,-50%) scale(0);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,244,214,1) 0%, rgba(242,200,121,.85) 28%, rgba(242,200,121,0) 70%);
    opacity:0;
    z-index:5;
    pointer-events:none;
    mix-blend-mode: screen;
  }
  .glow-burst.burst{
    animation: burst 900ms ease-out forwards;
  }
  @keyframes burst{
    0%   { transform:translate(-50%,-50%) scale(0);   opacity:0; }
    12%  { opacity:1; }
    100% { transform:translate(-50%,-50%) scale(48);  opacity:0; }
  }

  .flash{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 52%, rgba(255,238,204,.9), rgba(255,238,204,0) 62%);
    opacity:0;
    z-index:4;
    pointer-events:none;
    mix-blend-mode: screen;
  }
  .flash.on{
    animation: flashFade 700ms ease-out forwards;
  }
  @keyframes flashFade{
    0%   { opacity:0; }
    18%  { opacity:1; }
    100% { opacity:0; }
  }

  .sparkle{
    position:absolute;
    left:49.9%; top:51.6%;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--glow);
    box-shadow:0 0 8px 2px rgba(242,200,121,.9);
    opacity:0;
    z-index:5;
    pointer-events:none;
  }
  .sparkle.go{
    animation: sparkleFly 800ms ease-out forwards;
  }
  @keyframes sparkleFly{
    0%   { opacity:0; transform:translate(-50%,-50%) translate(0,0) scale(1); }
    15%  { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(.3); }
  }

  /* ---------- Details page ---------- */
  #details{
    z-index:1;
    opacity:0;
    transform: scale(.97);
  }
  #details.reveal{
    animation: detailsIn 900ms ease-out forwards;
    animation-delay: .35s;
  }
  @keyframes detailsIn{
    to{ opacity:1; transform:scale(1); }
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .hint{
    position:absolute;
    left:50%; bottom:6%;
    transform:translateX(-50%);
    color: rgba(90,62,38,.75);
    font-size: clamp(11px, 2.6vw, 14px);
    letter-spacing:.06em;
    text-align:center;
    z-index:4;
    animation: hintFade 3.2s ease-in-out infinite;
    pointer-events:none;
    font-style: italic;
  }
  @keyframes hintFade{
    0%, 100% { opacity:.35; }
    50%      { opacity:.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .flap.opening, .body.dropping{ animation: fadeOutSimple 450ms ease forwards; }
    @keyframes fadeOutSimple{ to{ opacity:0; } }
    .seal-ring{ animation:none; }
    .hint{ animation:none; opacity:.6; }
    #details.reveal{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>

<script>
(function(){
  var sealBtn  = document.getElementById('sealBtn');
  var coverCard= document.getElementById('coverCard');
  var flap     = document.getElementById('flap');
  var envBody  = document.getElementById('envBody');
  var details  = document.getElementById('details');
  var glow     = document.getElementById('glow');
  var flash    = document.getElementById('flash');
  var hint     = document.getElementById('hint');
  var opened   = false;

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function spawnSparkles(){
    var n = 10;
    for (var i=0; i<n; i++){
      var s = document.createElement('span');
      s.className = 'sparkle';
      var angle = Math.random() * Math.PI * 2;
      var dist  = 60 + Math.random() * 140;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist;
      s.style.setProperty('--dx', dx + 'px');
      s.style.setProperty('--dy', dy + 'px');
      s.style.animationDelay = (Math.random()*120) + 'ms';
      coverCard.appendChild(s);
      requestAnimationFrame(function(el){
        return function(){ el.classList.add('go'); };
      }(s));
      (function(el){
        setTimeout(function(){ el.remove(); }, 1200);
      })(s);
    }
  }

  function openInvitation(){
    if (opened) return;
    opened = true;

    hint.style.opacity = '0';
    hint.style.visibility = 'hidden';
    sealBtn.disabled = true;
    sealBtn.style.pointerEvents = 'none';

    if (!reduced){
      flash.classList.add('on');
      glow.classList.add('burst');
      spawnSparkles();
    }

    if (reduced){
      // Simple, calm fallback: fade the whole envelope and reveal details.
      flap.classList.add('opening');
      envBody.classList.add('dropping');
      details.setAttribute('aria-hidden', 'false');
      details.classList.add('reveal');
      setTimeout(finish, 520);
      return;
    }

    // 1) The flap lifts open first, hinged at the top edge.
    setTimeout(function(){
      flap.classList.add('opening');
    }, 260);

    // 2) Once the flap has cleared, the body drops away below.
    setTimeout(function(){
      envBody.classList.add('dropping');
    }, 640);

    // 3) The details page settles into view as the body falls.
    setTimeout(function(){
      details.setAttribute('aria-hidden', 'false');
      details.classList.add('reveal');
    }, 700);

    setTimeout(finish, 1500);

    function finish(){
      coverCard.classList.add('hidden');
      coverCard.setAttribute('aria-hidden', 'true');
      details.setAttribute('tabindex', '-1');
      details.focus({preventScroll:true});
    }
  }

  sealBtn.addEventListener('click', openInvitation);
  sealBtn.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openInvitation();
    }
  });
})();
</script>
